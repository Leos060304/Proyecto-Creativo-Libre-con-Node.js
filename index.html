<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador Financiero: Ingresos y Gastos</title>
<style>
  body { 
    font-family: Arial, sans-serif; 
    max-width: 1100px; /* Incrementado para dar más espacio a la tabla */
    margin: 30px auto; 
    padding: 0 20px; 
    background: #f8f9fa; 
  }
  h1 { color: #1a252f; text-align: center; }
  .card { 
    background: white; 
    padding: 20px; 
    border-radius: 8px; 
    box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
    margin-bottom: 20px; 
    overflow-x: auto; /* Permite desplazamiento si la pantalla es muy angosta */
  }
  .form-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  input, select, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  
  /* Ajuste de inputs dentro de la tabla para optimizar espacio */
  table input[type="text"], table input[type="number"], table select {
    width: 90%;
    box-sizing: border-box;
  }

  button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
  button:hover { background: #218838; }
  .btn-download { background: #007bff; float: right; margin-bottom: 10px; }
  .btn-download:hover { background: #0056b3; }
  
  /* Indicadores Financieros */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .metric-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center; }
  .metric-title { font-size: 14px; color: #6c757d; font-weight: bold; }
  .metric-value { font-size: 22px; font-weight: bold; margin-top: 5px; }
  .val-income { color: #28a745; }
  .val-expense { color: #dc3545; }
  .val-balance { color: #007bff; }

  table { width: 100%; border-collapse: collapse; margin-top: 15px; table-layout: auto; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background-color: #e9ecef; }
</style>
</head>
<body>

  <h1>📊 Control de Ingresos y Gastos Mensuales</h1>

  <!-- Tarjetas de Resumen Financiero -->
  <div class="summary-grid">
    <div class="metric-card">
      <div class="metric-title">💵 Total Ingresos</div>
      <div class="metric-value val-income">$<span id="totalIncome">0.00</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">💸 Total Gastos</div>
      <div class="metric-value val-expense">$<span id="totalExpense">0.00</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">🏦 Saldo Disponible</div>
      <div class="metric-value val-balance">$<span id="totalBalance">0.00</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">📌 Registros</div>
      <div class="metric-value" style="color: #495057;"><span id="totalCount">0</span></div>
    </div>
  </div>

  <div class="card">
    <h3>➕ Agregar Movimiento (Ingreso o Gasto)</h3>
    <form id="manualForm" class="form-group">
      <select id="type" required>
        <option value="ingreso">🟢 Ingreso</option>
        <option value="gasto" selected>🔴 Gasto</option>
      </select>
      <input type="text" id="vendor" placeholder="Concepto (ej. Nómina, Farmacia)" required>
      <input type="number" step="0.01" id="amount" placeholder="Monto ($)" required>
      <select id="category">
        <option value="Sueldo/Nómina">Sueldo / Nómina</option>
        <option value="Ventas">Ventas / Negocio</option>
        <option value="Alimentos">Alimentos</option>
        <option value="Servicios">Servicios</option>
        <option value="Transporte">Transporte</option>
        <option value="Entretenimiento">Entretenimiento</option>
        <option value="Otros">Otros</option>
      </select>
      <input type="date" id="date" required>
      <button type="submit" id="btnSave">Guardar Movimiento</button>
    </form>
  </div>

  <div class="card">
    <a href="/api/expenses/export/excel" download>
      <button class="btn-download">📥 Descargar Excel (.xlsx)</button>
    </a>
    <h3>📋 Historial de Movimientos</h3>
    <table>
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Fecha</th>
          <th>Concepto</th>
          <th>Categoría</th>
          <th>Monto ($)</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="expensesTable"></tbody>
    </table>
  </div>

  <script>
  async function loadExpenses() {
    try {
      const res = await fetch('/api/expenses/summary');
      const data = await res.json();
      
      // Actualizar métricas
      document.getElementById('totalIncome').textContent = (data.totalIncome || 0).toFixed(2);
      document.getElementById('totalExpense').textContent = (data.totalExpenses || 0).toFixed(2);
      document.getElementById('totalBalance').textContent = (data.balance || 0).toFixed(2);
      document.getElementById('totalCount').textContent = data.count || 0;

      const tbody = document.getElementById('expensesTable');
      tbody.innerHTML = '';

      if (!data.items || data.items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay movimientos registrados.</td></tr>';
        return;
      }

      // Renderizar filas con botón de eliminar
      data.items.forEach(exp => {
        const isIncome = exp.type === 'ingreso';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <select onchange="updateExpense('${exp.id}', 'type', this.value)">
              <option value="ingreso" ${isIncome ? 'selected' : ''}>🟢 Ingreso</option>
              <option value="gasto" ${!isIncome ? 'selected' : ''}>🔴 Gasto</option>
            </select>
          </td>
          <td><input type="date" value="${exp.date}" onchange="updateExpense('${exp.id}', 'date', this.value)"></td>
          <td><input type="text" value="${exp.vendor}" onchange="updateExpense('${exp.id}', 'vendor', this.value)"></td>
          <td>
            <select onchange="updateExpense('${exp.id}', 'category', this.value)">
              <option value="Sueldo/Nómina" ${exp.category === 'Sueldo/Nómina' ? 'selected' : ''}>Sueldo/Nómina</option>
              <option value="Ventas" ${exp.category === 'Ventas' ? 'selected' : ''}>Ventas</option>
              <option value="Alimentos" ${exp.category === 'Alimentos' ? 'selected' : ''}>Alimentos</option>
              <option value="Servicios" ${exp.category === 'Servicios' ? 'selected' : ''}>Servicios</option>
              <option value="Transporte" ${exp.category === 'Transporte' ? 'selected' : ''}>Transporte</option>
              <option value="Entretenimiento" ${exp.category === 'Entretenimiento' ? 'selected' : ''}>Entretenimiento</option>
              <option value="Otros" ${exp.category === 'Otros' ? 'selected' : ''}>Otros</option>
            </select>
          </td>
          <td><input type="number" step="0.01" value="${exp.amount}" onchange="updateExpense('${exp.id}', 'amount', this.value)"></td>
          <td style="text-align: center;">
            <button onclick="deleteExpense('${exp.id}')" style="background: #dc3545; padding: 4px 8px; font-size: 12px;">🗑️ Borrar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch (err) {
      console.error('Error al cargar datos:', err);
    }
  }

  // Guardar nuevo registro
  document.getElementById('manualForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSave');
    btn.textContent = 'Guardando...';
    btn.disabled = true;

    const body = {
      type: document.getElementById('type').value,
      vendor: document.getElementById('vendor').value,
      amount: document.getElementById('amount').value,
      category: document.getElementById('category').value,
      date: document.getElementById('date').value
    };

    try {
      await fetch('/api/expenses/manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      document.getElementById('manualForm').reset();
      await loadExpenses();
    } catch (err) {
      alert('Error al guardar movimiento.');
    } finally {
      btn.textContent = 'Guardar Movimiento';
      btn.disabled = false;
    }
  });

  // Editar campo directamente
  async function updateExpense(id, field, value) {
    await fetch(`/api/expenses/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [field]: value })
    });
    await loadExpenses();
  }

  // Eliminar registro
  async function deleteExpense(id) {
    if (confirm('¿Estás seguro de que deseas borrar este registro?')) {
      await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
      await loadExpenses();
    }
  }

  loadExpenses();
</script>
